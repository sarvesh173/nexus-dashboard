name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # oxlint runs with --deny no-undef. That rule is the one that catches an
      # identifier used as though it were a local binding, which is exactly the
      # class of bug that blanks the whole app. It is worthless if it is
      # allowed to be silently inactive, so prove it fires on a canary before
      # trusting a green run below.
      - name: Prove no-undef is actually enforced
        run: |
          cp src/App.jsx /tmp/App.jsx.orig
          printf '\nfunction __canary(){ return __neverDefined; }\n' >> src/App.jsx
          if npx oxlint src/App.jsx 2>&1 | grep -q "__neverDefined"; then
            echo "no-undef fired on the canary, the rule is live"
          else
            echo "::error::no-undef is inert, it did not catch a canary. Fix the lint config before trusting a green run."
            exit 1
          fi
          cp /tmp/App.jsx.orig src/App.jsx

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The backend modules import yaml, requests and psutil at module scope.
      # Without this they raise ImportError and every suite below fails on a
      # clean runner even though it passes locally, where those packages are
      # already present. pip has to run BEFORE the suites, not with playwright.
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests psutil

      # The backend suites are offline: HTTP is stubbed and no key is needed.
      # They cover the cache-write race, the malformed-proxy guard, canonical
      # provider ids, the model-health registry and path resolution.
      - name: Backend unit tests
        run: |
          python3 tests/test_audit_fixes.py
          python3 tests/test_live_sync.py
          python3 tests/test_server_nvidia.py

      # Two servers, not one. vite preview serves the built frontend, but the
      # frontend fetches /api from the Python backend on :5174. The overview
      # checks assert that the cost cells resolve, which cannot happen while
      # that endpoint is dead. Start it and wait for it before the browser
      # tests. It needs no credentials: with none present every source degrades
      # to a warning and the endpoints still answer.
      - name: Start the backend
        run: |
          python3 server.py &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5174/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5174/api/health >/dev/null \
            || { echo "backend never came up"; kill $BACKEND_PID; exit 1; }
          echo "backend up on :5174, pid $BACKEND_PID"

      - run: pip install playwright && python -m playwright install --with-deps chromium

      # The nav test drives a real browser against a running dashboard, so CI
      # has to serve the built app itself. Nothing in this repo runs it.
      - name: Serve the built app
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ >/dev/null || { echo "preview never came up"; exit 1; }

      - name: Nav animation tests
        run: python3 tests/test_nav_animations.py

      - name: Overview motion tests
        run: python3 tests/test_overview_motion.py

      # The guard against a blank screen. A component that throws while
      # mounting leaves an empty root, and every check above it can still look
      # healthy, so this runs last and fails loudly.
      - name: Mount regression
        run: python3 tests/test_dashboard_mounts.py
