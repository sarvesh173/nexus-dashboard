name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Nav animation tests
        run: python3 tests/test_nav_animations.py
